general {
    # single lock entry point (no races)
    lock_cmd = pgrep -x gtklock >/dev/null || gtklock -d

    # before sleep: ensure lock first, then DPMS off
    before_sleep_cmd = pgrep -x gtklock >/dev/null || gtklock -d; sleep 1; hyprctl dispatch dpms off

    # after wake: restore display state only
    after_sleep_cmd = hyprctl dispatch dpms on

    # allow lock to fully engage before suspend
    inhibit_sleep = 2
}

########################
# IDLE MANAGEMENT FLOW #
########################

# 7 min: lock screen (ONLY lock, no dpms)
listener {
    timeout = 420
    on-timeout = pgrep -x gtklock >/dev/null || gtklock -d
}

# 8 min: turn off displays if still idle + locked
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min: suspend (single path only)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

#################
# LID BEHAVIOR  #
#################

# hypridle 0.1.8 has no lid-switch listener (a "listener { event = sw-down }"
# block here is a config error and gets silently ignored). Lid close is
# handled by systemd-logind (HandleLidSwitch=suspend), which triggers a real
# suspend; general.before_sleep_cmd/after_sleep_cmd above already cover
# locking before *any* suspend (lid-triggered or not) and restoring the
# display after resume.