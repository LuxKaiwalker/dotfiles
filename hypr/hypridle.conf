general {
    # single lock entry point (no races)
    lock_cmd = hyprctl dispatch exec hyprlock

    # before sleep: ensure lock first, then DPMS off
    before_sleep_cmd = hyprctl dispatch exec hyprlock && sleep 1 && hyprctl dispatch dpms off

    # after wake: restore display state only
    after_sleep_cmd = hyprctl dispatch dpms on

    # allow lock to fully engage before suspend
    inhibit_sleep = 2
}

########################
# IDLE MANAGEMENT FLOW #
########################

# 7 min: lock screen (ONLY lock, no dpms)
listener {
    timeout = 420
    on-timeout = hyprctl dispatch exec hyprlock
}

# 8 min: turn off displays if still idle + locked
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min: suspend (single path only)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

#################
# LID BEHAVIOR  #
#################

# Lid close → lock first, then suspend (delayed via systemd safety)
listener {
    event = sw-down
    on-status-changed = hyprctl dispatch exec hyprlock && sleep 1 && systemctl suspend
}

# Lid open → just restore display
listener {
    event = sw-up
    on-status-changed = hyprctl dispatch dpms on
}